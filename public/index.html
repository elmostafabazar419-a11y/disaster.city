
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>DISASTER CITY</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    body {
      position: fixed;
      inset: 0;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
      color: white;
      touch-action: manipulation;
    }

    #game {
      position: absolute;
      inset: 0;
      overflow: hidden;
      touch-action: none;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    /* Lobby */
    #lobby {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(8, 14, 27, 0.88);
      backdrop-filter: blur(8px);
    }

    #lobby.hidden {
      display: none;
    }

    #lobby > * {
      max-width: 100%;
    }

    #lobby .panel,
    #lobby .card,
    #lobby form {
      max-width: 420px;
    }

    #lobby input {
      width: 100%;
      min-height: 46px;
      padding: 12px;
      margin: 6px 0;
      border: 1px solid #3b4963;
      border-radius: 12px;
      background: #172238;
      color: white;
      outline: none;
    }

    #lobby input:focus {
      border-color: #438dff;
    }

    #lobby button {
      min-height: 44px;
      padding: 10px 16px;
      border: 0;
      border-radius: 12px;
      background: #2769ee;
      font-weight: 700;
    }

    /* HUD */
    #hud {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
    }

    #topbar {
      position: absolute;
      top: max(12px, env(safe-area-inset-top));
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    #topbar > * {
      pointer-events: auto;
    }

    #topbar button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 12px;
      background: rgba(12, 20, 36, .82);
    }

    #playerList {
      position: absolute;
      top: 68px;
      right: 12px;
      max-width: 180px;
      padding: 10px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 12px;
      background: rgba(12, 20, 36, .72);
      font-size: 12px;
    }

    #crosshair {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 7px;
      height: 7px;
      border: 1px solid rgba(255,255,255,.65);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    #toast {
      position: absolute;
      top: 22%;
      left: 50%;
      max-width: 90%;
      padding: 10px 16px;
      border-radius: 12px;
      background: rgba(8, 14, 27, .82);
      text-align: center;
      transform: translateX(-50%);
    }

    #bottom {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(12px, env(safe-area-inset-bottom));
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 18px;
      pointer-events: none;
    }

    #help {
      max-width: 45%;
      padding: 8px 10px;
      border-radius: 10px;
      background: rgba(8, 14, 27, .55);
      color: rgba(255,255,255,.8);
      font-size: 11px;
    }

    /* Mobile controls */
    #mobileControls {
      display: none;
      width: 100%;
      align-items: flex-end;
      justify-content: space-between;
      pointer-events: none;
    }

    #stick {
      position: relative;
      width: 116px;
      height: 116px;
      flex: 0 0 116px;
      border: 2px solid rgba(255,255,255,.38);
      border-radius: 50%;
      background: rgba(15, 24, 42, .38);
      box-shadow: inset 0 0 18px rgba(0,0,0,.2);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    #stick::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 38px;
      height: 38px;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    #knob {
      position: absolute;
      left: 34px;
      top: 34px;
      width: 44px;
      height: 44px;
      border: 2px solid rgba(255,255,255,.8);
      border-radius: 50%;
      background: rgba(80, 140, 255, .8);
      box-shadow: 0 3px 12px rgba(0,0,0,.35);
      pointer-events: none;
    }

    #jump {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 72px;
      height: 72px;
      margin: 0 4px 10px 0;
      padding: 0;
      border: 2px solid rgba(255,255,255,.65);
      border-radius: 50%;
      background: rgba(39, 105, 238, .72);
      box-shadow: 0 5px 18px rgba(0,0,0,.3);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    #jump:active {
      transform: scale(.93);
      background: rgba(65, 135, 255, .95);
    }

    #jump svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: white;
      stroke-width: 2.8;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    @media (max-width: 650px) {
      #mobileControls {
        display: flex;
      }

      #bottom {
        bottom: max(14px, env(safe-area-inset-bottom));
        padding: 0 18px;
      }

      #help {
        display: none;
      }

      #playerList {
        top: 66px;
        right: 8px;
        bottom: 150px;
        overflow: auto;
        max-width: 145px;
        font-size: 11px;
      }

      #topbar {
        top: max(8px, env(safe-area-inset-top));
        left: 8px;
        right: 8px;
      }

      #topbar button {
        min-height: 36px;
        padding: 7px 9px;
        font-size: 12px;
      }

      #stick {
        width: 108px;
        height: 108px;
        flex-basis: 108px;
      }

      #knob {
        left: 31px;
        top: 31px;
        width: 42px;
        height: 42px;
      }

      #jump {
        width: 68px;
        height: 68px;
      }
    }

    @media (max-width: 380px) {
      #stick {
        width: 96px;
        height: 96px;
        flex-basis: 96px;
      }

      #knob {
        left: 27px;
        top: 27px;
        width: 40px;
        height: 40px;
      }

      #jump {
        width: 62px;
        height: 62px;
      }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="lobby">
    <!-- Keep your existing lobby contents here if your original
         index.html already has a room creation/joining interface. -->
    <div class="panel">
      <h1>DISASTER CITY</h1>
      <p>Enter the city and survive the disaster.</p>
      <p style="font-size:13px;color:#b9c5d8">
        Use your existing room creation interface in this panel.
      </p>
    </div>
  </div>

  <div id="hud">
    <div id="topbar">
      <div id="roomInfo"></div>
      <button id="leaveBtn" type="button" aria-label="Leave game" title="Leave game">↩</button>
    </div>

    <div id="playerList"></div>
    <div id="crosshair"></div>
    <div id="toast"></div>

    <div id="bottom">
      <div id="help">WASD to move · Space to jump · Drag to look</div>

      <div id="mobileControls">
        <div id="stick" aria-label="Movement joystick">
          <div id="knob"></div>
        </div>

        <button id="jump" type="button" aria-label="Jump" title="Jump">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V5"></path>
            <path d="M5.5 11.5 12 5l6.5 6.5"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/game.js"></script>
</body>
</html>
