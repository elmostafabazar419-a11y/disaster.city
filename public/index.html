
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>DISASTER CITY</title>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #101827; color: #fff; font-family: Arial, sans-serif;
      overscroll-behavior: none;
    }

    body { position: fixed; inset: 0; }
    button, input { font: inherit; }
    button { cursor: pointer; color: white; touch-action: manipulation; }
    button:disabled { opacity: .55; cursor: not-allowed; }

    #game { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
    #game canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    #lobby {
      position: absolute; inset: 0; z-index: 20;
      display: flex; align-items: center; justify-content: center;
      overflow-y: auto; padding: 20px;
      background: rgba(5,10,22,.76); backdrop-filter: blur(9px);
    }

    #lobby.hidden, #hud.hidden { display: none !important; }

    .panel {
      width: min(100%, 430px); max-height: 96%;
      overflow-y: auto; padding: 28px;
      border: 1px solid rgba(255,255,255,.13); border-radius: 22px;
      background: rgba(14,23,41,.97);
      box-shadow: 0 22px 70px rgba(0,0,0,.4);
    }

    .brand { margin: 0 0 8px; font-size: clamp(28px,7vw,40px); font-weight: 900; letter-spacing: -1.5px; }
    .brand span { color: #4b8cff; }
    .subtitle { margin: 0 0 22px; color: #aebbd0; line-height: 1.5; font-size: 14px; }
    .field-label { display: block; margin: 14px 0 6px; color: #dce5f4; font-size: 13px; font-weight: 700; }

    #lobby input {
      display: block; width: 100%; min-height: 46px; padding: 12px 14px;
      border: 1px solid #35445e; border-radius: 11px;
      background: #101a2d; color: white; outline: none;
    }

    #lobby input:focus { border-color: #438dff; box-shadow: 0 0 0 3px rgba(67,141,255,.13); }
    #lobby input::placeholder { color: #75849c; }
    #roomCode { text-transform: uppercase; }

    .button-stack { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 18px; }

    .lobby-button {
      width: 100%; min-height: 47px; padding: 12px 16px;
      border: 0; border-radius: 11px; background: #2869ed; font-weight: 800;
    }

    .lobby-button.secondary { border: 1px solid #34435d; background: #1a2740; }
    .lobby-button.practice { border: 1px solid rgba(61,199,145,.4); background: rgba(23,117,87,.3); }
    .lobby-button:active { transform: scale(.985); }

    .section-divider {
      display: flex; align-items: center; gap: 12px; margin: 18px 0 2px;
      color: #8190a8; font-size: 11px; text-transform: uppercase; letter-spacing: 1.3px;
    }

    .section-divider::before, .section-divider::after { content: ""; height: 1px; flex: 1; background: #2c3950; }

    #statusText {
      min-height: 18px; margin: 14px 0 0; color: #a9bbd6;
      font-size: 12px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere;
    }

    #notice {
      display: none; margin-top: 12px; padding: 10px 12px;
      border: 1px solid rgba(255,104,104,.35); border-radius: 10px;
      background: rgba(170,40,50,.15); color: #ffc0c0;
      font-size: 12px; line-height: 1.4; overflow-wrap: anywhere;
    }

    #notice.visible { display: block; }

    #lobbyPlayers {
      margin-top: 12px; color: #aebbd0; font-size: 12px;
    }

    #hud { position: absolute; inset: 0; z-index: 5; pointer-events: none; }

    #topbar {
      position: absolute; top: max(12px,env(safe-area-inset-top));
      left: 12px; right: 12px; display: flex; align-items: center;
      justify-content: space-between; gap: 8px; flex-wrap: wrap;
    }

    #topbar > * { pointer-events: auto; }

    #roomInfo {
      display: flex; align-items: center; flex-wrap: wrap; gap: 8px;
      max-width: 78%; padding: 9px 12px;
      border: 1px solid rgba(255,255,255,.15); border-radius: 12px;
      background: rgba(12,20,36,.9); font-size: 12px; overflow-wrap: anywhere;
    }

    #codeBadge { color: #8db8ff; font-weight: 900; letter-spacing: 1.5px; }

    #copyCodeBtn, #leaveBtn {
      min-height: 36px; padding: 7px 10px; border: 1px solid #40516d;
      border-radius: 9px; background: #1a2740; font-size: 11px; font-weight: 800;
    }

    #playerList {
      position: absolute; top: 68px; right: 12px; width: max-content;
      max-width: 190px; max-height: 40%; overflow-y: auto; padding: 10px;
      border: 1px solid rgba(255,255,255,.15); border-radius: 12px;
      background: rgba(12,20,36,.8); font-size: 12px; overflow-wrap: anywhere;
    }

    .player-row { display: flex; align-items: center; gap: 7px; margin: 4px 0; }
    .dot { display: inline-block; width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; }

    #crosshair {
      position: absolute; left: 50%; top: 50%; width: 7px; height: 7px;
      border: 1px solid rgba(255,255,255,.65); border-radius: 50%;
      transform: translate(-50%,-50%);
    }

    #toast {
      display: none; position: absolute; top: 22%; left: 50%;
      max-width: 90%; padding: 10px 16px; border-radius: 12px;
      background: rgba(8,14,27,.9); text-align: center;
      transform: translateX(-50%); overflow-wrap: anywhere;
    }

    #bottom {
      position: absolute; left: 0; right: 0;
      bottom: max(12px,env(safe-area-inset-bottom));
      display: flex; align-items: flex-end; justify-content: space-between;
      padding: 0 18px; pointer-events: none;
    }

    #help { max-width: 45%; padding: 8px 10px; border-radius: 10px; background: rgba(8,14,27,.6); color: rgba(255,255,255,.85); font-size: 11px; }

    #mobileControls {
      display: none; width: 100%; align-items: flex-end;
      justify-content: space-between; pointer-events: none;
    }

    #stick {
      position: relative; width: 116px; height: 116px; flex: 0 0 116px;
      border: 2px solid rgba(255,255,255,.38); border-radius: 50%;
      background: rgba(15,24,42,.42); box-shadow: inset 0 0 18px rgba(0,0,0,.2);
      pointer-events: auto; touch-action: none; user-select: none;
    }

    #stick::before {
      content: ""; position: absolute; left: 50%; top: 50%; width: 38px; height: 38px;
      border: 1px solid rgba(255,255,255,.15); border-radius: 50%;
      transform: translate(-50%,-50%);
    }

    #knob {
      position: absolute; left: 34px; top: 34px; width: 44px; height: 44px;
      border: 2px solid rgba(255,255,255,.8); border-radius: 50%;
      background: rgba(65,130,255,.88); box-shadow: 0 3px 12px rgba(0,0,0,.35);
      pointer-events: none;
    }

    #jump {
      display: flex; align-items: center; justify-content: center;
      width: 72px; height: 72px; margin: 0 4px 10px 0; padding: 0;
      border: 2px solid rgba(255,255,255,.65); border-radius: 50%;
      background: rgba(39,105,238,.8); box-shadow: 0 5px 18px rgba(0,0,0,.3);
      pointer-events: auto; touch-action: none; user-select: none;
    }

    #jump:active { transform: scale(.93); background: rgba(65,135,255,.95); }
    #jump svg { width: 34px; height: 34px; fill: none; stroke: white; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }

    @media (max-width:650px) {
      .panel { padding: 23px 20px; }
      #mobileControls { display: flex; }
      #bottom { bottom: max(14px,env(safe-area-inset-bottom)); padding: 0 18px; }
      #help { display: none; }
      #playerList { top: 66px; right: 8px; bottom: 150px; max-height: none; max-width: 145px; font-size: 11px; }
      #topbar { top: max(8px,env(safe-area-inset-top)); left: 8px; right: 8px; }
      #stick { width: 108px; height: 108px; flex-basis: 108px; }
      #knob { left: 31px; top: 31px; width: 42px; height: 42px; }
      #jump { width: 68px; height: 68px; }
    }

    @media (max-width:380px) {
      .panel { padding: 20px 16px; }
      #stick { width: 96px; height: 96px; flex-basis: 96px; }
      #knob { left: 27px; top: 27px; width: 40px; height: 40px; }
      #jump { width: 62px; height: 62px; }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <main id="lobby">
    <section class="panel">
      <h1 class="brand">DISASTER <span>CITY</span></h1>
      <p class="subtitle">Enter the city. Survive the disaster. Play with your friends.</p>

      <label class="field-label" for="playerName">PLAYER NAME</label>
      <input id="playerName" type="text" maxlength="16" placeholder="Enter your name" autocomplete="nickname">

      <div class="button-stack">
        <button id="createBtn" class="lobby-button" type="button">CREATE ROOM</button>
      </div>

      <div class="section-divider">OR JOIN FRIENDS</div>

      <label class="field-label" for="roomCode">ROOM CODE</label>
      <input id="roomCode" type="text" maxlength="5" placeholder="Enter 5-character code" autocomplete="off" spellcheck="false">

      <div class="button-stack">
        <button id="joinBtn" class="lobby-button secondary" type="button">JOIN ROOM</button>
        <button id="soloBtn" class="lobby-button practice" type="button">PLAY SOLO</button>
      </div>

      <p id="statusText" role="status" aria-live="polite">Connecting to server...</p>
      <div id="notice" role="alert"></div>
      <div id="lobbyPlayers"></div>
    </section>
  </main>

  <div id="hud" class="hidden">
    <div id="topbar">
      <div id="roomInfo">
        <span>ROOM CODE:</span>
        <strong id="codeBadge">WAITING</strong>
        <button id="copyCodeBtn" type="button">COPY CODE</button>
      </div>
      <button id="leaveBtn" type="button">LEAVE</button>
    </div>

    <div id="playerList"></div>
    <div id="crosshair"></div>
    <div id="toast" role="status"></div>

    <div id="bottom">
      <div id="help">WASD to move · Space to jump · Drag to look</div>
      <div id="mobileControls">
        <div id="stick" aria-label="Movement joystick"><div id="knob"></div></div>
        <button id="jump" type="button" aria-label="Jump" title="Jump">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 19V5"></path>
            <path d="M5.5 11.5 12 5l6.5 6.5"></path>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/game.js"></script>

  <script>
    // Keep the lobby visible until the player actually joins a game.
    // This also provides clear feedback if the server connection fails.
    const statusEl = document.getElementById("statusText");
    const noticeEl = document.getElementById("notice");

    window.addEventListener("error", function (event) {
      if (noticeEl) {
        noticeEl.textContent = "Game error: " + (event.message || "Unknown error");
        noticeEl.classList.add("visible");
      }
    });

    window.addEventListener("unhandledrejection", function (event) {
      if (noticeEl) {
        noticeEl.textContent = "Game error: " + (event.reason?.message || String(event.reason || "Unknown error"));
        noticeEl.classList.add("visible");
      }
    });

    if (statusEl && noticeEl) {
      const oldText = statusEl.textContent;
      if (oldText) statusEl.textContent = oldText;
    }
  </script>
</body>
</html>
